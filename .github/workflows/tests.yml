name: Testes da Ayla

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ayla_v2/requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r ayla_v2/requirements-dev.txt

      - name: Verificar sintaxe
        run: python -m compileall -q ayla_v2

      - name: Testes offline (sem Qwen ou chave de pesquisa)
        run: python -m pytest -q ayla_v2/tests
